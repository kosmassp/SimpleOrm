name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Builds every TFM, including the netstandard2.0 legs of the core and dialect.
      - name: Build
        run: dotnet build dotnet/SimpleOrm.sln --configuration Release

      # Tests run against real temp-file SQLite databases; no services needed (ADR-0003).
      - name: Test
        run: dotnet test dotnet/SimpleOrm.sln --configuration Release --no-build --logger "console;verbosity=normal"
